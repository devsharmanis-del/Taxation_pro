header{backdrop-filter:blur(12px);background:color-mix(in srgb,var(--card) 86%,transparent)}
.kpi .card b{background:linear-gradient(90deg,var(--pr),#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
h4{margin:16px 0 6px}

function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:90vw';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000)}

if(x==='pv'||x==='pr'){const p=pays.find(z=>z.id===v);if(p){if(x==='pv'){p.st='Verified';if(!p.lid){const l=leads.find(z=>z.phone===p.phone);if(l)p.lid=l.id}}else p.st='Rejected';sv('cs_pays',pays);render()}return}
if(x==='paysub'){const n=$('#q_n').value.trim(),ph=$('#q_p').value.trim(),m=+$('#q_a').value,u=$('#q_u').value.trim();if(!n||!ok10(ph)||!m||!u)return toast('Naam, mobile, amount aur UTR zaroori hain');pays.push({id:'p'+Date.now(),name:n,phone:ph,lid:(leads.find(z=>z.phone===ph)||{}).id||'',amt:m,mode:'UPI',utr:u,ts:Date.now(),st:'Pending'});sv('cs_pays',pays);toast('Dhanyavaad! Verify hone ke baad journal me dikhega.');return}

if(x==='uadd'){const u=$('#u_u').value.trim(),p=$('#u_p').value.trim();if(!u||p.length<4||users.some(z=>z.u===u))return toast('Unique username aur 4+ digit PIN chahiye');users.push({u,pin:p,role:'staff',name:$('#u_n').value||u});sv('cs_users',users);render();return}

const closeM=()=>$('#modal').classList.remove('on');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
function enq(s){modal(`<h3 style="margin-top:0">Enquiry / Registration</h3><div id="eb"><label>Poora naam*</label><input id="e_n"><label>Mobile (10 digit)*</label><input id="e_p" inputmode="numeric" maxlength="10"><label>Shehar, State</label><input id="e_c" placeholder="Agra, Uttar Pradesh"><label>Service</label><select id="e_s">${SERV.map(x=>`<option ${x[0]===s?'selected':''}>${x[0]}</option>`).join('')}</select><label>Aapki zaroorat</label><textarea id="e_m" rows="3"></textarea><p><button class="btn" data-a="esend">Submit</button> <button class="btn o" data-a="close">Band karein</button></p></div>`)}
const ok10=p=>/^[6-9]\d{9}$/.test(p);
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const x=a.dataset.a,v=a.dataset.v;
if(x==='enq')enq(v);else if(x==='close')closeM();
else if(x==='esend'){const n=$('#e_n').value.trim(),p=$('#e_p').value.trim();if(!n||!ok10(p)){alert('Naam aur sahi 10 digit mobile number daalein.');return}const s=$('#e_s').value,m=$('#e_m').value;addLead({name:n,phone:p,city:$('#e_c').value,service:s,msg:m});$('#eb').innerHTML=`<div class="ok">Dhanyavaad ${esc(n)}! Aapki enquiry darj ho gayi.</div><p><a class="btn g" target="_blank" rel="noopener" href="${wa('Namaste, main '+n+'. Mujhe '+s+' ke baare me jaankari chahiye. '+m)}">WhatsApp par bhi bhejein</a> <button class="btn o" data-a="close">Band karein</button></p>`}
else if(x==='icat'){ins.cat=v;ins.co='';render()}else if(x==='ico'){ins.co=v;render()}else if(x==='insr'){ins={cat:'',co:'',done:null};render()}
else if(x==='insub'){const n=$('#in_n').value.trim(),p=$('#in_p').value.trim();if(!n||!ok10(p)){alert('Naam aur sahi mobile number zaroori hai.');return}if(!$('#in_k').checked){alert('Kripya sahmati par tick karein.');return}
const d=[...document.querySelectorAll('.in_x')].map(i=>i.dataset.l+': '+i.value).join('; ');addLead({name:n,phone:p,city:$('#in_c').value,service:'Insurance – '+ins.cat,msg:ins.co+' | '+d+' | DOB: '+$('#in_d').value+' | '+$('#in_e').value});ins.done='Namaste, main '+n+'. '+ins.cat+' insurance ('+ins.co+') ke liye request submit ki hai.';render()}
else if(x==='st'){}else if(x==='del'){if(a.dataset.s){leads=leads.filter(l=>l.id!==v);save();render()}else{a.dataset.s=1;a.textContent='Pakka?'}}
else if(x==='wadd'){const n=$('#w_n').value.trim(),p=$('#w_p').value.trim();if(!n||!ok10(p)){alert('Naam aur sahi mobile daalein.');return}addLead({name:n,phone:p,service:$('#w_s').value,msg:$('#w_m').value,source:'WhatsApp'});render()}
else if(x==='clrdemo'){leads=leads.filter(l=>l.source!=='Demo');save();render()}
else if(x==='cfg'){cfg={brand:$('#c_b').value||'SD Media Tech Solutions Pvt. Ltd.',tag:$('#c_t').value,color:$('#c_c').value,wa:$('#c_w').value,upi:$('#c_u').value,upn:$('#c_un').value,plink:$('#c_pl').value};ls.set('cs_cfg',cfg);render();alert('Save ho gaya.')}
else if(x==='cbt'){$('#cb').classList.toggle('on');if(!$('#cm').children.length)bot0()}
else if(x==='cbs')send($('#ct').value);else if(x==='cbq')send(v);else act(x,v,a)});
document.addEventListener('change',e=>{const a=e.target.dataset;if(a.a==='st'){const l=leads.find(l=>l.id===a.v);if(l){l.status=e.target.value;save();render()}}if(a.a==='nt'){const l=leads.find(l=>l.id===a.v);if(l){l.note=e.target.value;save()}}});
$('#ct').addEventListener('keydown',e=>{if(e.key==='Enter')send($('#ct').value)});
/* Chatbot */
let cs={step:'',svc:'',name:''};
const say=(t,c)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#cm').appendChild(d);$('#cm').scrollTop=1e5};
const qr=a=>{$('#cq').innerHTML=a.map(t=>`<span class="chip" data-a="cbq" data-v="${esc(t)}">${esc(t)}</span>`).join('')};
const MENU=['Company Registration','GST','Accounting','ITR','Insurance','Callback chahiye'];
function bot0(){say('Namaste! 🙏 Main '+cfg.brand+' ka sahayak hoon. Aap kis cheez ke baare me jaanna chahte hain?','b');qr(MENU)}
const KB=[[/company|llp|pvt|private|opc|firm|partnership/i,'Company Registration','Pvt Ltd, LLP, OPC, Partnership ya Proprietorship – aapke business ke hisaab se sahi structure hum batayenge. Documents: PAN, Aadhaar, address proof aur photo.'],[/gst/i,'GST','GST registration, monthly/quarterly filing aur notice support available hai. Documents: PAN, Aadhaar, business address proof, bank details.'],[/account|book|tally/i,'Accounting','Monthly bookkeeping, MIS aur Tally/Busy support available hai.'],[/itr|income|tax|tds/i,'ITR','Individual, firm aur company ITR tatha TDS filing me madad milti hai.'],[/insur|bima|policy|vehicle|car|bike|health|life/i,'Insurance','Life, Health, Motor, Travel aur Business insurance – kisi bhi company ka. Insurance page par 3 steps me form bhar sakte hain: #insurance'],[/price|fees|charge|kitna|rate/i,'Enquiry','Fees service aur business size par depend karti hai. Apna naam aur number dein, team exact quote bhejegi.']];
function send(t){t=(t||'').trim();if(!t)return;$('#ct').value='';say(t,'u');$('#cq').innerHTML='';
if(cs.step==='name'){cs.name=t;cs.step='phone';return say('Dhanyavaad '+t+'. Apna 10 digit mobile number batayein.','b')}
if(cs.step==='phone'){if(!ok10(t.replace(/\s/g,''))){return say('Kripya sahi 10 digit mobile number likhein.','b')}addLead({name:cs.name,phone:t.replace(/\s/g,''),service:cs.svc||'General Enquiry',source:'Chatbot',msg:'Chatbot se aaya'});cs.step='';say('Aapki details save ho gayi hain ✅ Hamari team jald contact karegi.','b');return qr(MENU)}
if(/callback|call|enquiry|baat|contact|connect/i.test(t)){cs.step='name';cs.svc=cs.svc||'General Enquiry';return say('Zaroor! Aapka naam kya hai?','b')}
const k=KB.find(x=>x[0].test(t));if(k){cs.svc=k[1]==='Enquiry'?cs.svc:k[1];say(k[2],'b');return qr(['Callback chahiye','Doosri service'])}
if(/doosri|menu|hi|hello|namaste/i.test(t)){return bot0()}
say('Main aapki poori madad ke liye team se connect kar dunga. Naam aur number dene ke liye "Callback chahiye" dabayein.','b');qr(MENU)}
render();
</script></body></html>
